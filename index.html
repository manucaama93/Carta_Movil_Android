<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>TV</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }

    #img-fondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
    }

    #carta {
      position: absolute;
      width: 430px;
      height: auto;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0) rotate(0deg);
      opacity: 1;
      transition: opacity 0.1s ease-out;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      pointer-events: auto;
      display: none;
      z-index: 10;
    }

    /* ZONA SECRETA DE DOBLE TOQUE */
    #zona-secreta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 110px;
      z-index: 10000;
      background: transparent;
      touch-action: none;
    }

    /* MENÚ DE SELECCIÓN INICIAL Y CONFIGURACIÓN */
    #capa-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      color: #fff;
    }

    #capa-menu h2 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn-baraja {
      width: 220px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-baraja:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <img id="img-fondo" src="fondo.png" alt="Fondo">
  <img id="carta" src="" alt="Carta">
  <div id="zona-secreta"></div>

  <div id="capa-menu">
    <h2>Seleccionar Baraja</h2>
    <button class="btn-baraja" onclick="seleccionarBaraja('roja')">Baraja Roja</button>
    <button class="btn-baraja" onclick="seleccionarBaraja('azul')">Baraja Azul</button>
  </div>

  <script>
    // Registro del Service Worker para soporte PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    function seleccionarBaraja(color) {
      const menu = document.getElementById('capa-menu');
      if (menu) menu.style.display = 'none';
    }
  </script>
</body>
</html>
