<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>TV</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }

    #img-fondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
    }

    #carta {
      position: absolute;
      width: 430px;
      height: auto;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0) rotate(0deg);
      opacity: 1;
      transition: opacity 0.1s ease-out;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      pointer-events: auto;
      display: none;
      z-index: 10;
    }

    /* ZONA SECRETA DE DOBLE TOQUE */
    #zona-secreta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 110px;
      z-index: 10000;
      background: transparent;
      touch-action: none;
    }

    /* MENÚ DE SELECCIÓN INICIAL Y CONFIGURACIÓN */
    #capa-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      color: #fff;
    }

    #capa-menu h2 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn-baraja {
      width: 220px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-baraja:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <img id="img-fondo" src="fondo.png" alt="Fondo">
  <img id="carta" src="" alt="Carta">
  <div id="zona-secreta"></div>

  <div id="capa-menu">
    <h2>Seleccionar Baraja</h2>
    <button class="btn-baraja" onclick="seleccionarBaraja('roja')">Baraja Roja</button>
    <button class="btn-baraja" onclick="seleccionarBaraja('azul')">Baraja Azul</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    const carta = document.getElementById('carta');
    const capaMenu = document.getElementById('capa-menu');
    const zonaSecreta = document.getElementById('zona-secreta');

    let barajaSeleccionada = 'roja';
    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let initialX = 0, initialY = 0;
    let lastTap = 0;

    function seleccionarBaraja(color) {
      barajaSeleccionada = color;
      carta.src = color === 'roja' ? 'carta_roja.png' : 'carta_azul.png';
      capaMenu.style.display = 'none';
      
      // Posición inicial centrada
      initialX = (window.innerWidth - 430) / 2;
      initialY = (window.innerHeight - 300) / 2;
      currentX = initialX;
      currentY = initialY;
      
      actualizarPosicion(currentX, currentY, 0);
      carta.style.display = 'block';
    }

    function actualizarPosicion(x, y, rot) {
      carta.style.transform = `translate3d(${x}px, ${y}px, 0px) rotate(${rot}deg)`;
    }

    // Interacción táctil (Arrastre)
    carta.addEventListener('touchstart', (e) => {
      isDragging = true;
      const touch = e.touches[0];
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      const touch = e.touches[0];
      currentX = touch.clientX - startX;
      currentY = touch.clientY - startY;
      
      // Ligera rotación natural al arrastrar
      const deltaX = touch.clientX - (startX + currentX);
      const rotacion = Math.max(-15, Math.min(15, deltaX * 0.2));
      
      actualizarPosicion(currentX, currentY, rotacion);
    }, { passive: false });

    window.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      actualizarPosicion(currentX, currentY, 0);
    });

    // Doble toque en zona secreta superior para reabrir el menú
    zonaSecreta.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        capaMenu.style.display = 'flex';
        e.preventDefault();
      }
      lastTap = currentTime;
    });
  </script>
</body>
</html>
